<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Promoções Telepizza</title>
</head>
<body>
  <div class="promotions-wrapper">
    <!-- Promoção 1: Takeaway e Delivery -->
    <div class="col-12 offer-tile__wrap promo-card-item" data-tab-content="delivery,takeaway" data-display-priority="1">
      <div class="offer-tile__content">
        <a class="offer-tile__view-more__btn-icon"
           data-id="2ADMMK"
           data-name="1 M&eacute;dia Descomplicada por 10&euro;"
           data-detail="1 Pizza M&eacute;dia com massa fofa at&eacute; 3 ingredientes por apenas 10&euro;."
           data-img-url="https://images.telepizza.pt/promos/2admmk.webp"
           data-img-alt="1 Média Descomplicada">
          Ver Mais
        </a>
      </div>
    </div>

    <!-- Promoção 2: Apenas Takeaway -->
    <div class="col-12 offer-tile__wrap promo-card-item" data-tab-content="takeaway" data-display-priority="2">
      <div class="offer-tile__content">
        <a class="offer-tile__view-more__btn-icon"
           data-id="Med595_TK"
           data-name="M&eacute;dia ao Balc&atilde;o por 5,95&euro;"
           data-detail="Pre&ccedil;o v&aacute;lido exclusivamente para levantamento em loja."
           data-img-url="https://images.telepizza.pt/promos/med595.webp"
           data-img-alt="Média ao Balcão">
          Ver Mais
        </a>
      </div>
    </div>

    <!-- Promoção 3: 2x1 Dias Temáticos -->
    <div class="col-12 offer-tile__wrap promo-card-item" data-tab-content="delivery,takeaway" data-display-priority="3">
      <div class="offer-tile__content">
        <a class="offer-tile__view-more__btn-icon"
           data-id="2X1_NC"
           data-name="2x1 em Todas as Pizzas"
           data-detail="Na compra de 1 pizza m&eacute;dia ou familiar, recebe outra de valor igual ou inferior."
           data-img-url="https://images.telepizza.pt/promos/2x1.webp"
           data-img-alt="2x1 Telepizza">
          Ver Mais
        </a>
      </div>
    </div>
  </div>
</body>
</html>
